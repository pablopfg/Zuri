          <rect width="64" height="64" rx="16" class="fill-brand-tile" />
          <g class="fill-brand-signal motion-safe:animate-pulse">
            <circle cx="32" cy="19" r="12" opacity="0.25" />
            <circle cx="32" cy="19" r="7" />
          </g>
          <rect x="27" y="31" width="10" height="21" rx="5" class="fill-brand-mark" />
