name: Update PRs

# When develop moves, brings it into every open pull request into develop and
# resolves the conflicts that are only two additions at the same place
# (scripts/atualizar-prs.ts). Any other conflict gets one comment on the pull
# request. It never merges, never force-pushes and never pushes to develop or
# main. GitHub holds the pull_request runs that a GITHUB_TOKEN push starts
# ("action_required"), and the rulesets count only those runs' checks, so the
# script approves the runs its own push started (never a fork's). The same
# jobs as always run on the new commit. docs/agente/merge-de-prs.md.
# When the run fails, report-failure opens a standard issue (docs/agente/issues.md).
on:
  push:
    branches: [develop]
  # Catches what no push shows: an older pull request closed or out of draft
  # leaves a stale merge-order result on the newer ones.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

# One run at a time; a newer push to develop replaces the run still waiting.
concurrency:
  group: update-prs
  cancel-in-progress: false

jobs:
  update:
    # A dispatch from another branch would run that branch's copy with write access.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # contents: push the merge commit to the PR branch; pull-requests: the comment;
    # actions: approve the held pull_request runs and rerun a stale merge-order.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # The script runs from develop, never from a pull request branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Update the open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          # Nothing from a PR branch runs: no LFS download, no hooks.
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/atualizar-prs.ts
      - name: Refresh stale merge-order results
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ordem-de-merge.ts --atualizar

  # Nobody owns a failed scheduled or push run, so it opens (or updates) one
  # standard issue instead (scripts/issue-de-falha.ts, docs/agente/issues.md).
  report-failure:
    needs: update
    # A step stuck past timeout-minutes ends the job as cancelled: that is a failure here too.
    if: always() && github.ref == 'refs/heads/develop' && (needs.update.result == 'failure' || needs.update.result == 'cancelled')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # issues: create the issue, its labels and the repeat comment; actions: read the failed steps.
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/issue-de-falha.ts
