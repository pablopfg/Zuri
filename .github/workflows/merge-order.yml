name: Merge order

# The "merge-order" check required by the rulesets. Auto-merge takes whichever
# pull request turns green first; this check holds a pull request while an
# older open one into develop changes the same code (scripts/ordem-de-merge.ts,
# docs/agente/merge-de-prs.md). It reads the open pull requests and their
# files, nothing else. Label events rerun it (the "fora-de-ordem" override).
# workflow_dispatch: update-prs.yml reruns it on a branch when the result went
# stale (an older pull request closed, left draft or changed files).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-order-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The script comes from develop: a pull request cannot change the rule that judges it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Only the pull request that adds the check finds no script on develop.
      # Once it lands, the repository tests import the script, so it cannot go away quietly.
      - run: |
          if [ ! -f scripts/ordem-de-merge.ts ]; then
            echo "develop ainda não tem scripts/ordem-de-merge.ts: nada a conferir"
            exit 0
          fi
          node scripts/ordem-de-merge.ts
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatched runs have no pull request: the branch finds it.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
