<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- /moldura -->
<title>Zuri, nova organização</title>
<style>
/* Modelo para aprovação: a organização escolhida (lateral clássica, sem projetos na lateral,
   conversas recentes dentro de Conversa) com o visual de hoje: paleta "Sinal" de
   apps/web/src/styles.css, fonte do sistema, ícones da lucide que o app já usa e a logomarca
   de apps/web/src/components/Logo.tsx. Traz todas as telas, os menus e as sete seções de
   Configurações de hoje, os textos revisados, o carregamento e a atualização só do que mudou.
   As cores entram pelo script em :root. */
:root {
  --bg: #f9f9fb; --surface: #ffffff; --raised: #f0f0f3; --border: #e0e1e6; --border-strong: #b9bbc6;
  --fg: #1c2024; --muted: #60646c; --accent: #2a7e3b; --accent-hover: #236c33; --accent-fg: #ffffff;
  --accent-soft: #e9f6e9; --accent-text: #2a7e3b; --duo: #daf1db;
  --danger: #ce2c31; --danger-soft: #feebec;
  --side-bg: #fcfcfd; --side-fg: #1c2024; --side-muted: #60646c; --side-active: #e9f6e9; --side-active-fg: #2a7e3b; --side-border: #e0e1e6; --side-hover: #f0f0f3;
  --logo-bg: #1c2024; --logo-fg: #fcfcfd; --logo-dot: #46a758;
  --scrim: rgba(17, 17, 19, 0.4); --shadow: 0 1px 2px rgba(17, 17, 19, 0.06), 0 12px 32px rgba(17, 17, 19, 0.1);
  --radius: 12px; --font: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --stroke: 1.75;
  --proto-bg: #1c2024; --proto-fg: #edeef0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111113; --surface: #18191b; --raised: #212225; --border: #2e3135; --border-strong: #5a6169;
  --fg: #edeef0; --muted: #b0b4ba; --accent: #46a758; --accent-hover: #53b365; --accent-fg: #0b1a0e;
  --accent-soft: #1b2a1e; --accent-text: #71d083; --duo: #1d3a24;
  --danger: #ff9592; --danger-soft: #3b1219;
  --side-bg: #18191b; --side-fg: #edeef0; --side-muted: #b0b4ba; --side-active: #1d3a24; --side-active-fg: #71d083; --side-border: #272a2d; --side-hover: #212225;
  --logo-bg: #272a2d; --logo-fg: #edeef0; --logo-dot: #46a758;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.45);
  --proto-bg: #000000; --proto-fg: #edeef0;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111113; --surface: #18191b; --raised: #212225; --border: #2e3135; --border-strong: #5a6169;
  --fg: #edeef0; --muted: #b0b4ba; --accent: #46a758; --accent-hover: #53b365; --accent-fg: #0b1a0e;
  --accent-soft: #1b2a1e; --accent-text: #71d083; --duo: #1d3a24;
  --danger: #ff9592; --danger-soft: #3b1219;
  --side-bg: #18191b; --side-fg: #edeef0; --side-muted: #b0b4ba; --side-active: #1d3a24; --side-active-fg: #71d083; --side-border: #272a2d; --side-hover: #212225;
  --logo-bg: #272a2d; --logo-fg: #edeef0; --logo-dot: #46a758;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.45);
  --proto-bg: #000000; --proto-fg: #edeef0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11"; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: var(--stroke); stroke-linecap: var(--cap, round); stroke-linejoin: var(--join, round); }
svg.i.sm { width: 16px; height: 16px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Barra do protótipo */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; display: flex; align-items: center; gap: 8px 14px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--proto-bg); color: var(--proto-fg); font: 500 13px/1.3 system-ui, sans-serif; overflow-x: auto; scrollbar-width: none; }
.proto .opts { display: flex; gap: 4px; flex: none; }
.proto button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 8px; color: inherit; opacity: 0.75; white-space: nowrap; }
.proto button:hover { opacity: 1; }
.proto button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.14); opacity: 1; font-weight: 700; }
.proto .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4); }
.proto .sep { flex: 1; min-width: 8px; }
.limpo .proto { display: none; }
#app { height: calc(100dvh - 44px); }
.limpo #app { height: 100dvh; }

/* Moldura */
.shell { display: flex; height: 100%; }
.side { display: flex; flex-direction: column; width: 272px; flex: none; background: var(--side-bg); color: var(--side-fg); border-right: 1px solid var(--side-border); transition: width .18s; }
.side-floating .shell { padding: 10px 0 10px 10px; }
.side-floating .side { border: 1px solid var(--side-border); border-radius: calc(var(--radius) + 6px); box-shadow: var(--shadow); }
.side-head { display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 8px 0 16px; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
.logo { width: 32px; height: 32px; flex: none; }
.logo .lb { fill: var(--logo-bg); } .logo .lf { fill: var(--logo-fg); } .logo .ld { fill: var(--logo-dot); }
.headbtns { display: flex; }
.iconbtn { position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: calc(var(--radius) - 2px); color: inherit; }
.iconbtn:hover { background: var(--side-hover); }
.main .iconbtn:hover { background: var(--raised); }
.side-body { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
.newchat { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 0 14px; margin-bottom: 14px; border-radius: var(--radius); background: var(--accent); color: var(--accent-fg); font-weight: 650; font-size: 14.5px; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.15) inset, 0 1px 2px rgba(0, 0, 0, 0.12); }
.newchat:hover { background: var(--accent-hover); }
.newchat kbd { margin-left: auto; font: 600 11.5px/1 var(--font); }
.nav { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 0 12px; border-radius: calc(var(--radius) - 2px); color: var(--side-muted); font-size: 14.5px; font-weight: 550; text-align: left; }
.row:hover { background: var(--side-hover); color: var(--side-fg); }
.row[aria-current="page"] { background: var(--side-active); color: var(--side-active-fg); font-weight: 650; }
.row .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--side-hover); color: var(--side-muted); font-size: 12px; font-weight: 650; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.row[aria-current="page"] .count { background: var(--accent); color: var(--accent-fg); }
.side-foot { padding: 10px 12px 12px; border-top: 1px solid var(--side-border); }
.acct { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 6px 8px; border-radius: var(--radius); text-align: left; }
.acct:hover { background: var(--side-hover); }
.acct .nm { flex: 1; min-width: 0; line-height: 1.25; }
.acct small { display: block; color: var(--side-muted); font-size: 12.5px; }
.avatar { display: inline-grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 14px; }
.collapsed .side { width: 72px; }
.collapsed .side-head { flex-direction: column; gap: 2px; min-height: 0; padding: 12px 0 8px; }
.collapsed .headbtns { flex-direction: column; }
.collapsed .brand .wm, .collapsed .row .txt, .collapsed .count, .collapsed .acct .nm, .collapsed .acct .chev, .collapsed .newchat .txt, .collapsed .newchat kbd { display: none; }
.collapsed .row, .collapsed .newchat { justify-content: center; padding: 0; }
.collapsed .side-body, .collapsed .side-foot { padding-left: 12px; padding-right: 12px; }
.collapsed .acct { justify-content: center; padding: 6px 0; }

.main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 64px; padding: 0 16px 0 28px; }
.topbar .ttl { font-weight: 650; font-size: 15px; }
.topbar .left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.mob { display: none; }
.minibrand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
main { flex: 1; min-width: 0; overflow-y: auto; }
.page { max-width: 1000px; margin: 0 auto; padding: 8px 40px 120px; }
.badge { position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-size: 11px; font-weight: 750; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--bg); }

/* Início */
.hello { margin: 0 0 22px; }
.hello .date { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 13px; font-weight: 600; }
.hello h1 { margin: 12px 0 6px; font-size: clamp(28px, 3.4vw, 38px); line-height: 1.1; letter-spacing: -0.03em; font-weight: 700; text-wrap: balance; }
.hello p { margin: 0; color: var(--muted); font-size: 16px; max-width: 58ch; }
.composer { background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--radius) + 8px); box-shadow: var(--shadow); padding: 6px 6px 6px 18px; }
.composer:focus-within { border-color: var(--accent-text); }
.composer .line { display: flex; align-items: center; gap: 6px; }
.composer input { flex: 1; min-width: 0; min-height: 52px; border: 0; outline: 0; background: transparent; font-size: 16px; }
.composer input::placeholder { color: var(--muted); }
.mic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--radius); color: var(--muted); }
.mic:hover { background: var(--raised); color: var(--fg); }
.send { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--radius); background: var(--accent); color: var(--accent-fg); }
.send:hover { background: var(--accent-hover); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 28px; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--fg); font-size: 14px; font-weight: 550; }
.chip svg { color: var(--accent-text); }
.chip:hover { border-color: var(--accent-text); }
.grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
.box { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--radius) + 6px); padding: 18px 20px 8px; }
.box h2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 4px; font-size: 16px; letter-spacing: -0.01em; }
.box h2 a { color: var(--accent-text); font-size: 13.5px; font-weight: 650; }
.box h2 a:hover { text-decoration: underline; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li + li { border-top: 1px solid var(--border); }
.task { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; }
.check { display: grid; place-items: center; width: 24px; height: 24px; margin-top: 1px; flex: none; border: 2px solid var(--border-strong); border-radius: 50%; color: transparent; }
.check:hover { border-color: var(--accent-text); color: var(--accent-text); }
.task.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.task.done .tt { color: var(--muted); text-decoration: line-through; }
.tt { font-weight: 550; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 3px; color: var(--muted); font-size: 13px; }
.tag { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 6px; background: var(--raised); color: var(--muted); font-size: 12px; font-weight: 600; }
.late { color: var(--danger); font-weight: 650; }
.timeline { list-style: none; margin: 6px 0 10px; padding: 0; }
.timeline li { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 8px 0 12px; }
.timeline li::before { content: ""; position: absolute; left: 66px; top: 16px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.timeline li::after { content: ""; position: absolute; left: 70px; top: 30px; bottom: -6px; width: 1px; background: var(--border); }
.timeline li:last-child::after { display: none; }
.timeline .when { color: var(--muted); font-size: 13px; font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; padding-top: 2px; }
.timeline .what { padding-left: 22px; }

/* Conversa: recentes à esquerda, conversa à direita */
.chatwrap { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
.convlist { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--surface); }
.convlist .top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 14px 14px 8px; }
.field { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--muted); }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); }
.field:focus-within { border-color: var(--accent-text); }
.convlist .scroll { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
.grp { padding: 14px 10px 4px; color: var(--muted); font-size: 12.5px; font-weight: 650; }
.conv { display: grid; gap: 1px; width: 100%; padding: 9px 10px; border-radius: calc(var(--radius) - 2px); text-align: left; }
.conv:hover { background: var(--raised); }
.conv[aria-current="page"] { background: var(--accent-soft); }
.conv[aria-current="page"] .ct { color: var(--accent-text); }
.conv .ct { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .cs { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: var(--radius); font-weight: 650; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border: 1px solid var(--border); background: var(--surface); }
.btn.ghost:hover { background: var(--raised); }
.chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.chat .msgs { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 16px; padding: 24px 40px; }
.bubble { max-width: 62ch; padding: 12px 16px; border-radius: calc(var(--radius) + 6px); }
.bubble.me { justify-self: end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 6px; }
.bubble.zuri { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
.who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 650; }
.who .logo { width: 24px; height: 24px; }
.chat .foot { padding: 0 40px 24px; }
.page-empty { display: grid; justify-items: center; gap: 8px; margin-top: 28px; padding: 52px 24px; text-align: center; border: 1px dashed var(--border-strong); border-radius: calc(var(--radius) + 6px); }
.page-empty .ic { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); }
.page-empty h2 { margin: 6px 0 0; font-size: 18px; }
.page-empty p { margin: 0; max-width: 46ch; color: var(--muted); }
.page-empty.err .ic { background: var(--danger-soft); color: var(--danger); }
.pagehead h1 { margin: 14px 0 4px; font-size: 28px; letter-spacing: -0.02em; }
.pagehead p { margin: 0; color: var(--muted); }
/* Carregamento: esqueleto no formato do conteúdo, linha de progresso e o sinal da logo pulsando.
   Só CSS; com "reduzir movimento" ligado tudo fica parado (regra no topo). */
.sk { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--raised) 0%, var(--raised) 35%, color-mix(in srgb, var(--raised) 35%, var(--surface)) 50%, var(--raised) 65%, var(--raised) 100%); background-size: 300% 100%; animation: shimmer 1.6s ease-in-out infinite; }
.sk.t { height: 14px; width: 70%; } .sk.s { width: 40%; margin-top: 8px; } .sk.c { width: 24px; height: 24px; border-radius: 50%; flex: none; }
.sk.b { height: 42px; border-radius: var(--radius); }
.skrow { display: flex; gap: 12px; padding: 14px 0; } .skrow > div { flex: 1; }
.list.sk-list > li + li, .sk-list > .skrow + .skrow { border-top: 1px solid var(--border); }
.skconv { padding: 10px 10px; } .skconv .sk.s { width: 80%; margin-top: 7px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.progress { position: relative; height: 2px; margin-bottom: -2px; overflow: hidden; z-index: 5; }
.progress::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 35%; border-radius: 2px; background: var(--accent); animation: slide 1.1s cubic-bezier(.4, 0, .2, 1) infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.thinking { display: inline-flex; align-items: center; gap: 10px; justify-self: start; padding: 10px 16px 10px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--radius) + 6px); border-bottom-left-radius: 6px; color: var(--muted); font-size: 14px; }
.thinking .logo { width: 28px; height: 28px; }
.logo.working .ring { transform-box: fill-box; transform-origin: center; animation: ring 1.6s ease-out infinite; }
.logo.working .dot { transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
@keyframes ring { 0% { transform: scale(.55); opacity: .55; } 100% { transform: scale(1.35); opacity: 0; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } }
.dots { display: inline-flex; gap: 4px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s ease-in-out infinite; } .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
.proto .load[aria-pressed="true"] .sw { background: #22c55e; }

/* Camadas */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.palette { position: fixed; z-index: 50; top: 12vh; left: 50%; width: min(620px, calc(100vw - 32px)); transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--radius) + 8px); box-shadow: var(--shadow); overflow: hidden; }
.palette .q { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 18px; border-bottom: 1px solid var(--border); color: var(--muted); }
.palette .q input { flex: 1; min-height: 58px; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 16px; }
.palette .res { max-height: 50vh; overflow-y: auto; padding: 8px; }
.palette .gh { padding: 8px 10px 4px; color: var(--muted); font-size: 12px; font-weight: 650; }
.palette .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 10px; border-radius: calc(var(--radius) - 2px); text-align: left; }
.palette .opt[aria-selected="true"], .palette .opt:hover { background: var(--raised); }
.palette .opt.ask { color: var(--accent-text); font-weight: 650; }
.pop { position: fixed; z-index: 45; width: 300px; max-width: calc(100vw - 24px); padding: 8px; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); box-shadow: var(--shadow); }
.pop h2 { margin: 6px 10px 6px; font-size: 14px; }
.pop .note { display: grid; gap: 2px; padding: 10px; border-radius: calc(var(--radius) - 2px); font-size: 14px; }
.pop .note:hover, .pop .mi:hover { background: var(--raised); }
.pop .note small { color: var(--muted); font-size: 12px; }

  const isDark = () => (S.theme ? S.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
  const fr = (key) => (S.fresh.has(key) ? " fresh" : "");
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const busy = (what) => `<span class="sr" role="status">Carregando ${what}…</span>`;
  const skRows = (n = 3) => `<ul class="list sk-list" aria-hidden="true">${Array.from({ length: n }, () => '<li class="skrow"><span class="sk c"></span><div><span class="sk t"></span><span class="sk s"></span></div></li>').join("")}</ul>`;
  const empty = (icon, title, body, action = "") => `<div class="page-empty"><span class="ic">${ic(icon)}</span><h2>${title}</h2><p>${body}</p>${action}</div>`;
  const head = (title, desc, acts = "") => `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${acts ? `<div class="acts">${acts}</div>` : ""}</div>`;
  // No computador as seções de Configurações têm h2 próprio, então os cartões descem para h3.
  const cardH = () => (S.view === "configuracoes" && matchMedia("(min-width: 1024px)").matches ? "h3" : "h2");
  const sw = (key, label) => `<button class="switch" role="switch" aria-checked="${!!S.sw[key]}" aria-label="${label}" data-act="sw" data-k="${key}"></button>`;
  const card = (title, desc, body, extra = "") => `<section class="card"${extra}><${cardH()}>${title}</${cardH()}>${desc ? `<p class="desc">${desc}</p>` : ""}${body}</section>`;

  /* ---------- Início ---------- */
  const taskItem = (t) => `
    <li class="task${t.done ? " done" : ""}${fr(`t${t.id}`)}">
      <button class="check" data-act="task" data-id="${t.id}" role="checkbox" aria-checked="${t.done}" aria-label="Concluir: ${esc(t.t)}">${ic("check", "sm")}</button>
      <div class="body"><div class="tt">${esc(t.t)}</div><div class="meta"><span class="${t.due === "atrasada" && !t.done ? "late" : ""}">${t.when}</span>${t.proj ? `<span class="tag">${t.proj}</span>` : ""}${t.prio === "alta" ? '<span class="tag hi">Alta</span>' : ""}${t.from ? `<span class="tag new">${t.from}</span>` : ""}</div></div>
      <div class="rowacts"><button class="iconbtn" data-act="toast" data-msg="Abriria a edição da tarefa." aria-label="Editar: ${esc(t.t)}">${ic("pencil", "sm")}</button><button class="iconbtn" data-act="trash" data-id="${t.id}" aria-label="Mover para a lixeira: ${esc(t.t)}">${ic("trash", "sm")}</button></div>
    </li>`;
  const composer = (ph) => `<div class="composer"><div class="line">
      <label class="sr" for="cmp">Mensagem para a Zuri</label><input id="cmp" placeholder="${ph}" autocomplete="off">
      <button class="mic" aria-label="Falar em vez de escrever">${ic("mic")}</button>
      <button class="send" data-act="send" aria-label="Enviar">${ic("up")}</button></div></div>`;
  function home() {
    const list = today();
    const sub = list.length ? `${plural(list.length, "tarefa", "tarefas")}${late() ? `, ${late()} atrasada` : ""}` : "Tudo feito";
    const hoje = S.loading ? busy("as tarefas de hoje") + skRows() : list.length ? `<ul class="list">${list.map(taskItem).join("")}</ul>` : `<p class="muted small" style="padding:10px 0 14px">Nada para hoje. Quer adiantar algo dos próximos dias?</p>`;
    return `<div class="page">
      <div class="hello"><span class="date">${ic("cal", "sm")}Terça, 3 de novembro</span><h1>Boa noite, Ana!</h1><p>Como foi o seu dia?</p></div>
      ${composer("Escreva para a Zuri")}
      <div class="chips"><button class="chip" data-act="palette">${ic("spark", "sm")}Organizar a semana</button><button class="chip" data-act="palette">${ic("spark", "sm")}O que tenho amanhã?</button><button class="chip" data-act="palette">${ic("spark", "sm")}Me lembre de pagar a luz</button></div>
      <div class="grid2">
        <section class="box"${S.loading ? ' aria-busy="true"' : ""}><h2>Hoje <a href="#" data-go="tarefas">Ver tarefas</a></h2><p class="sub">${sub}</p>${hoje}</section>
        <section class="box"${S.loading ? ' aria-busy="true"' : ""}><h2>Próximos dias <a href="#" data-go="tarefas" data-tv="proximas">Ver próximas</a></h2><p class="sub">Tarefas com prazo e automações marcadas</p>
          ${S.loading ? skRows() : `
          <div class="day">Amanhã</div><ul class="agenda">
            <li><span class="when">7h</span>${ic("sunrise", "sm")}<div class="what">Resumo da manhã<small>Automação</small></div></li>
            <li><span class="when">9h</span>${ic("tasks", "sm")}<div class="what">Dentista<small>Tarefa · Saúde</small></div></li></ul>
          <div class="day">Quinta, 5</div><ul class="agenda">
            <li><span class="when"></span>${ic("tasks", "sm")}<div class="what">Separar os documentos da mudança<small>Tarefa · Mudança</small></div></li></ul>
          <div class="day">Sexta, 6</div><ul class="agenda">
            <li><span class="when">18h</span>${ic("spark", "sm")}<div class="what">Revisão de sexta<small>Rotina da Zuri</small></div></li></ul>`}
        </section>
      </div></div>`;
  }

  /* ---------- Conversa ---------- */
  function chat() {
    let last = "", list = "";
    CONVS.forEach((c, i) => {
      if (c.g !== last) { list += `<div class="grp">${c.g}</div>`; last = c.g; }
      list += `<button class="conv" data-act="open" ${i === 0 ? 'aria-current="page"' : ""}><span class="ct">${c.t}</span><span class="cs">${c.s}</span></button>`;
    });
    const plan = S.planDone
      ? `<div class="callout">${ic("ok")}<div><b>Plano aprovado</b><p>As quatro tarefas já estão em Tarefas, no projeto Mudança.</p></div></div>`
      : `<section class="card" aria-label="Plano proposto"><h2>Plano proposto: 4 tarefas no projeto Mudança</h2><p class="desc">Nada é criado antes de você aprovar.</p>
          <ul class="list">${["Pedir três orçamentos de mudança · até dia 8", "Avisar o síndico da data · até dia 10", "Desligar a internet do apartamento · dia 19", "Fazer a vistoria de entrega · dia 20"].map((x) => `<li class="small" style="padding:8px 0">${x}</li>`).join("")}</ul>
          <div class="btnrow" style="margin-top:12px"><button class="btn primary sm" data-act="plan">${ic("check", "sm")}Aprovar</button><button class="btn ghost sm" data-act="toast" data-msg="Plano recusado.">Recusar</button></div></section>`;
    return `<div class="chatwrap${S.chatOpen ? " open" : ""}">
      <h1 class="sr">Conversa</h1><aside class="convlist" aria-label="Conversas">
        <div class="top"><button class="btn primary" data-act="open">${ic("newchat")}Nova conversa</button>
        <div class="field">${ic("search", "sm")}<label class="sr" for="cf">Buscar conversas</label><input id="cf" placeholder="Buscar conversas"></div></div>
        <div class="scroll"${S.loading ? ' aria-busy="true"' : ""}>${S.loading ? busy("as conversas") + [0, 1, 2, 3].map(() => '<div class="skconv" aria-hidden="true"><span class="sk t"></span><span class="sk s"></span></div>').join("") : list}</div>
      </aside>
      <section class="chat" aria-label="Organizar a mudança">
        <div class="msgs">
          <button class="iconbtn only-mob" data-act="close" aria-label="Voltar para as conversas">${ic("back")}</button>
          <div class="bubble me">Me ajuda a organizar a mudança? As chaves saem no dia 20.</div>
          ${S.loading ? `<div class="thinking" role="status">${logo("logo working")}<span>A Zuri está pensando</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>` : `<div class="who">${logo()}Zuri</div>
          <div class="bubble zuri">Montei um plano com quatro tarefas até o dia 20. Confere se faz sentido? Só crio depois do seu ok.</div>${plan}`}
        </div>
        <div class="foot">${composer("Responda ou peça outra coisa")}</div>
      </section></div>`;
  }

  /* ---------- Tarefas ---------- */
  function tasks() {
    const v = S.taskView;
    const list = S.tasks.filter((t) => inView(t, v));
    const seg = TASK_VIEWS.map((x) => `<button aria-pressed="${x.id === v}" data-act="tv" data-v="${x.id}">${x.label}<span class="n">${S.tasks.filter((t) => inView(t, x.id)).length}</span></button>`).join("");
    const EMPTY = {
      hoje: ["Nada para hoje", "Aproveite o tempo livre ou adiante algo de Próximas."],
      proximas: ["Nada com prazo pela frente", "Tarefas com data aparecem aqui, da mais próxima para a mais distante."],
      atrasadas: ["Nenhuma tarefa atrasada", "Tudo em dia."],
      concluidas: ["Nenhuma tarefa concluída ainda", "O que você marcar como feito fica aqui por 30 dias."],
      todas: ["Nenhuma tarefa ainda", "Adicione a primeira no campo acima ou peça para a Zuri na conversa."],
    }[v];
    const body = S.loading ? busy("as tarefas") + skRows(4) : list.length ? `<ul class="list">${list.map(taskItem).join("")}</ul>` : empty("tasks", EMPTY[0], EMPTY[1]);
    return `<div class="page">${head("Tarefas", "O que vence hoje, o que vem depois e o que já foi feito.", `<button class="btn ghost sm" data-act="toast" data-msg="Abriria os projetos.">${ic("folder", "sm")}Projetos</button><button class="btn ghost sm" data-act="toast" data-msg="Abriria a lixeira.">${ic("trash", "sm")}Lixeira</button>`)}
      <div class="quick">${ic("plus", "sm")}<label class="sr" for="qa">Adicionar tarefa para hoje</label><input id="qa" placeholder="Adicionar tarefa para hoje" autocomplete="off"><button class="more" data-act="toast" data-msg="Abriria prazo, projeto e prioridade.">Prazo, projeto e prioridade</button><button class="btn primary sm" data-act="addtask">Adicionar</button></div>
      <div class="toolbar"><div class="seg" role="group" aria-label="Mostrar">${seg}</div>
        <div class="field">${ic("search", "sm")}<label class="sr" for="ts">Buscar tarefas</label><input id="ts" placeholder="Buscar tarefas"></div>
        <label class="sr" for="tp">Filtrar por projeto</label><select class="sel" id="tp"><option>Todos os projetos</option><option>Mudança</option><option>Casa</option><option>Saúde</option><option>Sem projeto</option></select></div>
      <section class="box"${S.loading ? ' aria-busy="true"' : ""}><h2 class="sr">${TASK_VIEWS.find((x) => x.id === v).label}</h2>${body}</section></div>`;
  }

  /* ---------- Notas ---------- */
  function notes() {
    const n = S.notes.find((x) => x.id === S.note) || S.notes[0];
    const list = S.loading ? busy("as notas") + [0, 1, 2].map(() => '<div class="skconv" aria-hidden="true"><span class="sk t"></span><span class="sk s"></span></div>').join("")
      : S.notes.map((x) => `<button class="note${fr(`n${x.id}`)}" data-act="note" data-id="${x.id}"${x.id === n.id ? ' aria-current="page"' : ""}><span class="ct">${esc(x.t)}</span><span class="cs">${esc(x.s)}</span><span class="cs">${x.when}</span></button>`).join("");
    // Prévia simples: títulos fora da lista, itens dentro dela.
    let md = "", inList = false;
    for (const l of n.md.split("\n")) {
      if (l.startsWith("### ")) { if (inList) { md += "</ul>"; inList = false; } md += `<h2>${esc(l.slice(4))}</h2>`; continue; }
      if (!inList) { md += "<ul>"; inList = true; }
      md += `<li>${esc(l.replace(/^- (\[[ x]\] )?/, (m, b) => (b ? (b.includes("x") ? "☑ " : "☐ ") : "")))}</li>`;
    }
    if (inList) md += "</ul>";
    return `<div class="notewrap${S.noteOpen ? " open" : ""}">
      <h1 class="sr">Notas</h1><aside class="notelist" aria-label="Suas notas">
        <div class="top"><button class="btn primary" data-act="toast" data-msg="Nota nova aberta.">${ic("plus")}Nova nota</button>
          <div class="field">${ic("search", "sm")}<label class="sr" for="ns">Buscar notas</label><input id="ns" placeholder="Buscar notas"></div></div>
        <div class="scroll"${S.loading ? ' aria-busy="true"' : ""}>${list}</div></aside>
      <section class="editor" aria-label="Editar nota">
        <div class="bar"><button class="iconbtn only-mob" data-act="noteback" aria-label="Voltar para as notas">${ic("back")}</button>
          <div class="seg" role="group" aria-label="Modo do editor"><button aria-pressed="${S.noteMode === "escrever"}" data-act="nm" data-v="escrever">Escrever</button><button aria-pressed="${S.noteMode === "ver"}" data-act="nm" data-v="ver">Visualizar</button></div>
          <div class="btnrow"><button class="btn ghost sm" data-act="toast" data-msg="Nota movida para a lixeira." aria-label="Mover a nota para a lixeira">${ic("trash", "sm")}</button><button class="btn primary sm" data-act="toast" data-msg="Nota salva.">Salvar</button></div></div>
        <label class="sr" for="nt">Título</label><input class="ttl" id="nt" value="${esc(n.t)}">
        ${S.noteMode === "ver" ? `<div class="prose">${md}</div>` : `<label class="sr" for="nb">Texto da nota</label><textarea id="nb">${esc(n.md)}</textarea>`}
        <div class="foot"><span>Aceita Markdown: # título, **negrito**, - lista e - [ ] tarefa. Ctrl+S salva.</span><span>${n.when}</span></div>
      </section></div>`;
  }

  /* ---------- Memória ---------- */
  function memory() {
    const f = S.memFilter;
    const list = S.mems.filter((m) => f === "todas" || m.st === f);
    const seg = MEM_FILTERS.map((x) => `<button aria-pressed="${x.id === f}" data-act="mf" data-v="${x.id}">${x.label}<span class="n">${S.mems.filter((m) => x.id === "todas" || m.st === x.id).length}</span></button>`).join("");
    const items = S.loading ? busy("as memórias") + skRows(4) : list.length ? list.map((m) => `
      <div class="item${fr(`m${m.id}`)}"><span class="ic2${m.zuri ? " ok" : ""}">${ic(m.zuri ? "spark" : "memory", "sm")}</span>
        <div class="body"><div class="tt">${esc(m.t)}</div><div class="meta"><span class="tag">${m.kind}</span>${m.st === "incertas" ? '<span class="tag">Incerta</span>' : ""}<span>${m.meta}</span>${m.from ? `<span class="tag new">${m.from}</span>` : ""}</div></div>
        <div class="rowacts"><button class="iconbtn" data-act="toast" data-msg="Abriria a atualização deste fato." aria-label="Atualizar: ${esc(m.t)}">${ic("pencil", "sm")}</button><button class="iconbtn" data-act="toast" data-msg="Abriria o histórico." aria-label="Histórico: ${esc(m.t)}">${ic("history", "sm")}</button></div></div>`).join("")
      : empty("memory", "Nenhuma memória neste filtro", "Troque o filtro ou guarde uma memória nova acima.");
    return `<div class="page">${head("Memória", "O que a Zuri sabe sobre você. Corrija ou apague o que quiser; nada muda sem você saber.")}
      <div class="cards">
        ${S.review ? "" : `<section class="card"><h2>Para revisar <span class="pill" style="margin-left:6px">1</span></h2><p class="desc">Uma memória nova pode mudar uma antiga. Nada foi alterado: você decide.</p>
          <div class="compare"><div><small>Mais antiga</small>Trabalho como designer na agência Exemplo</div><div><small>Mais recente · ontem, pelo Telegram</small>Agora trabalho por conta própria</div></div>
          <div class="btnrow"><button class="btn primary sm" data-act="review" data-msg="A memória antiga agora é passado.">Marcar a antiga como passado</button><button class="btn ghost sm" data-act="review" data-msg="As duas memórias continuam atuais.">Manter as duas</button><button class="btn ghost sm" data-act="review" data-msg="A memória antiga foi apagada.">Substituir a antiga</button></div></section>`}
        <section class="card"><h2>Guardar uma memória</h2><p class="desc">Um fato por vez, com as suas palavras. Se ele mudar algo já guardado, a Zuri pergunta antes.</p>
          <div class="formgrid" style="grid-template-columns:1fr auto auto"><label><span class="sr">Memória</span><input class="inp" placeholder="Ex.: Moro em Curitiba desde 2024"></label><label><span class="sr">Tipo</span><select class="sel"><option>Fato</option><option>Preferência</option><option>Objetivo</option><option>Hábito</option><option>Pessoa</option><option>Projeto</option><option>Outro</option></select></label><button class="btn primary" data-act="toast" data-msg="Memória guardada.">Guardar</button></div></section>
        <section class="card"${S.loading ? ' aria-busy="true"' : ""}><h2 class="sr">Suas memórias</h2>
          <div class="toolbar" style="margin-top:0"><div class="seg" role="group" aria-label="Mostrar">${seg}</div>
            <div class="field">${ic("search", "sm")}<label class="sr" for="ms">Buscar nas memórias</label><input id="ms" placeholder="Buscar nas memórias"></div>
            <label class="sr" for="mt">Filtrar por tipo</label><select class="sel" id="mt"><option>Todos os tipos</option><option>Fato</option><option>Preferência</option><option>Objetivo</option><option>Pessoa</option></select></div>
          ${items}</section>
      </div></div>`;
  }

  /* ---------- Automações ---------- */
  function automations() {
    const active = S.autos.filter((a) => a.on).length;
    const items = S.loading ? busy("as automações") + skRows(4) : S.autos.map((a) => `
      <div class="item${fr(`a${a.id}`)}"><span class="ic2${a.on ? " ok" : ""}">${ic(a.icon, "sm")}</span>
        <div class="body"><div class="tt">${esc(a.name)} <span class="pill${a.on ? " on" : ""}" style="margin-left:4px">${a.running ? "Rodando…" : a.on ? "Ativa" : "Pausada"}</span></div>
          <div class="meta"><span class="tag">${a.kind}</span><span>${a.sched}</span><span>${a.next}</span>${a.quiet ? "<span>Só avisa quando houver algo</span>" : ""}</div></div>
        <div class="rowacts"><button class="iconbtn" data-act="run" data-id="${a.id}" aria-label="Rodar agora: ${esc(a.name)}">${ic("play", "sm")}</button><button class="iconbtn" data-act="pause" data-id="${a.id}" aria-label="${a.on ? "Pausar" : "Retomar"}: ${esc(a.name)}">${ic(a.on ? "pause" : "play", "sm")}</button><button class="iconbtn" data-act="toast" data-msg="Abriria a edição." aria-label="Editar: ${esc(a.name)}">${ic("pencil", "sm")}</button><button class="iconbtn" data-act="toast" data-msg="Abriria a confirmação para apagar." aria-label="Apagar: ${esc(a.name)}">${ic("trash", "sm")}</button></div></div>`).join("");
    const runs = S.runs.map((r) => `<div class="item${fr(`r${r.id}`)}"><span class="ic2 ${r.ok ? "ok" : "bad"}">${ic(r.ok ? "ok" : "alert", "sm")}</span><div class="body"><div class="tt">${esc(r.name)}</div><div class="meta"><span>${r.when}</span><span>${r.how}</span></div></div><span class="pill">${r.res}</span></div>`).join("");
    return `<div class="page">${head("Automações", "Lembretes, resumos e rotinas que rodam sozinhos, sempre no seu fuso.", `<span class="pill" style="align-self:center">${active} de 20 ativas</span><button class="btn primary sm" data-act="toast" data-msg="Abriria o formulário de automação.">${ic("plus", "sm")}Criar automação</button>`)}
      <div class="cards">
        ${S.pending ? `<section class="card"><h2>A Zuri sugeriu uma rotina</h2><p class="desc">Ela sugeriu isto numa conversa. Nada roda antes de você aprovar.</p>
          <div class="item" style="margin:0"><span class="ic2 ok">${ic("spark", "sm")}</span><div class="body"><div class="tt">Conferir a semana no domingo</div><div class="meta"><span class="tag">Rotina da Zuri</span><span>Domingos às 20h</span></div><p class="small muted" style="margin:6px 0 0">“Veja as tarefas da semana que vem e me diga o que está apertado.”</p></div></div>
          <div class="btnrow" style="margin-top:10px"><button class="btn primary sm" data-act="approve">Aprovar</button><button class="btn ghost sm" data-act="decline">Recusar</button></div></section>` : ""}
        <section class="card"${S.loading ? ' aria-busy="true"' : ""}><h2>Suas automações</h2><p class="desc">Lembretes avisam com o seu texto. Resumos listam as tarefas. Rotinas da Zuri usam IA a cada vez.</p>${items}</section>
        <section class="card"><h2>Últimas execuções</h2><p class="desc">O que cada automação entregou, da mais recente para a mais antiga.</p>${runs}</section>
      </div></div>`;
  }

  /* ---------- Acessos ---------- */
  function access() {
    return `<div class="page">${head("Acessos", "Cada tentativa de entrar na sua conta: aparelho, lugar aproximado e resultado. Fica guardado por 90 dias.")}
      <div class="toolbar"><label class="sr" for="ap">Período</label><select class="sel" id="ap"><option>Últimos 7 dias</option><option>Últimos 30 dias</option><option>Últimos 90 dias</option></select>
        <label class="sr" for="ar">Resultado</label><select class="sel" id="ar"><option>Todos os resultados</option><option>Só as entradas</option><option>Só as recusas</option></select></div>
      <section class="card"${S.loading ? ' aria-busy="true"' : ""}><h2 class="sr">Tentativas de entrar</h2>${S.loading ? busy("os acessos") + skRows(5) : ACCESS.map((a) => `
        <div class="item"><span class="ic2 ${a.ok ? "ok" : "bad"}">${ic(a.ok ? "ok" : "warn", "sm")}</span><div class="body"><div class="tt">${a.what}</div><div class="meta"><span>${a.dev}</span><span>${a.where}</span></div></div><span class="small muted">${a.when}</span></div>`).join("")}</section></div>`;
  }

  /* ---------- Configurações (submenu com as 7 seções de hoje) ---------- */
  function cfgBody(id) {
    switch (id) {
      case "conta": return `
        ${card("Nome, idioma e fuso horário", "Valem para as telas, os avisos e o bot do Telegram.", `<div class="formgrid">
          <label>Seu nome<input class="inp" value="Ana"><small>Aparece no cumprimento do Início. Até 40 caracteres.</small></label>
          <label>Idioma<select class="sel"><option>Português (Brasil)</option><option>English</option></select></label>
          <label>Fuso horário<select class="sel"><option>São Paulo (UTC−3)</option></select><small>Datas, lembretes e rotinas seguem este fuso.</small></label></div>

  function settings() {

    }
    return `<div class="page">${desk ? head("Configurações", "Sua conta, a segurança e o que a Zuri pode usar.") : `<a href="#" class="backlink" data-cfg="">${ic("back", "sm")}Configurações</a>`}
      <div class="cfg"><nav class="cfgnav" aria-label="Seções das configurações">${CFG.map((x) => `<a href="#" data-cfg="${x.id}"${x.id === cur.id ? ' aria-current="page"' : ""}>${ic(x.icon, "sm")}<span><b>${x.label}</b><small>${x.hint}</small></span></a>`).join("")}</nav>
        <div><div class="cfghead">${desk ? `<h2>${cur.label}</h2>` : `<h1 style="margin:0;font-size:26px">${cur.label}</h1>`}<p>${cur.hint}</p></div><div class="cards">${cfgBody(cur.id)}</div></div></div></div>`;
  }
  const content = () => {
    switch (S.view) {
      case "inicio": return home();

      case "memoria": return memory();
      case "automacoes": return automations();

      default: return settings();

  /* ---------- Camadas ---------- */
  function paletteOptions() {
    const q = S.query.trim().toLowerCase();
    const has = (s) => !q || s.toLowerCase().includes(q);
    const go = SECTIONS.filter((s) => has(s.label)).map((s) => ({ g: "Ir para", label: s.label, icon: s.icon, go: s.id }));
    const cfgs = CFG.filter((c) => q && (has(c.label) || has(c.hint))).map((c) => ({ g: "Configurações", label: `${c.label}: ${c.hint}`, icon: c.icon, cfg: c.id }));
    const acts = [{ label: "Nova conversa", icon: "newchat", go: "conversa" }, { label: "Adicionar tarefa", icon: "plus", msg: "Tarefa adicionada." }, { label: "Nova nota", icon: "notes", msg: "Nota nova aberta." }, { label: "Criar automação", icon: "auto", msg: "Abriria o formulário de automação." }, { label: "Trocar o tema", icon: "moon", act: "theme" }]
      .filter((a) => has(a.label)).map((a) => ({ g: "Fazer", ...a }));
    const found = [...S.tasks.map((t) => ({ label: t.t, icon: "tasks", go: "tarefas" })), ...S.notes.map((x) => ({ label: x.t, icon: "notes", go: "notas" })), ...CONVS.map((c) => ({ label: c.t, icon: "chat", go: "conversa" }))]
      .filter((x) => q && x.label.toLowerCase().includes(q)).map((x) => ({ g: "Encontrado", ...x }));
    const ask = q.includes(" ") ? [{ g: "Zuri", label: `Perguntar à Zuri: ${S.query.trim()}`, icon: "spark", go: "conversa", ask: true }] : [];
    return [...ask, ...found, ...acts, ...go, ...cfgs];
  }
  function palette() {
    const opts = paletteOptions();
    S.sel = Math.min(S.sel, Math.max(0, opts.length - 1));
    let last = "", html = "";
    opts.forEach((o, i) => {
      if (o.g !== last) { html += `<div class="gh" role="presentation">${o.g}</div>`; last = o.g; }
      html += `<button class="opt${o.ask ? " ask" : ""}" role="option" id="opt-${i}" aria-selected="${i === S.sel}" data-act="pick" data-i="${i}">${ic(o.icon, "sm")}<span>${esc(o.label)}</span></button>`;
    });
    if (!opts.length) html = `<div class="page-empty" style="border:0;margin:0;padding:28px 16px"><h2>Nada com “${esc(S.query.trim())}”</h2><p>Tente outra palavra. Se for uma pergunta, escreva a frase inteira e a Zuri responde.</p></div>`;
    return `<div class="scrim" data-act="palette"></div><div class="palette" role="dialog" aria-modal="true" aria-label="Buscar">
      <div class="q">${ic("search")}<label class="sr" for="pq">Buscar ou perguntar</label><input id="pq" role="combobox" aria-expanded="true" aria-controls="pres" aria-activedescendant="opt-${S.sel}" placeholder="Busque uma tela, tarefa, nota ou conversa" value="${esc(S.query)}" autocomplete="off"><button class="iconbtn" data-act="palette" aria-label="Fechar a busca">${ic("x")}</button></div>
      <div class="res" id="pres" role="listbox" aria-label="Resultados">${html}</div></div>`;
  }

    () => { const id = ++seq; S.runs.unshift({ id, name: "Tomar o remédio", when: "Agora", how: "No horário", res: "Entregue", ok: true }); S.autos[1].next = "Próxima: amanhã às 21h"; return [[`r${id}`, "a2"], "A automação Tomar o remédio rodou agora."]; },
    () => { const id = ++seq; S.mems.unshift({ id, t: "Prefiro reuniões depois das 10h", kind: "Preferência", meta: "anotada pela Zuri no Telegram", st: "atuais", zuri: true, from: "Nova" }); return [[`m${id}`], "Memória nova guardada pela Zuri."]; },
    () => { const id = ++seq; S.notes.unshift({ id, t: "Telefones da nova vizinhança", s: "Portaria, síndico e chaveiro…", when: "Editada agora, no celular", md: "- Portaria: ramal 9\n- Síndico: Sr. Paulo\n- Chaveiro: 24 horas" }); return [[`n${id}`], "Nota nova criada no celular."]; },
  ];
  const setTheme = (th) => { S.theme = th === "system" ? null : th; if (S.theme) root.setAttribute("data-theme", S.theme); else root.removeAttribute("data-theme"); };
  function go(view, fresh) {
    S.view = view; S.drawer = false; S.pop = null; S.palette = false; S.chatOpen = !!fresh; S.noteOpen = false;
    if (view !== "configuracoes") S.cfg = null;
    render(); document.getElementById("conteudo")?.focus();
  }
  function pick(i) {
    const o = paletteOptions()[i]; if (!o) return;
    S.palette = false;
    if (o.ask) { go("conversa", true); toast("A Zuri recebeu a pergunta."); return; }
    if (o.act === "theme") { setTheme(isDark() ? "light" : "dark"); render(); return; }
    if (o.msg) { render(); toast(o.msg); return; }
    if (o.cfg) { S.cfg = o.cfg; go("configuracoes"); S.cfg = o.cfg; render(); return; }
    go(o.go);
  }
  const byId = (list, id) => list.find((x) => x.id === Number(id));
  document.addEventListener("click", (e) => {
    const th = e.target.closest("[data-theme-set]");
    if (th) { const v = th.dataset.themeSet; setTheme(v === "dark" ? "dark" : v === "light" ? "light" : "system"); render(); return; }
    const cf = e.target.closest("[data-cfg]");
    if (cf) { e.preventDefault(); const id = cf.dataset.cfg; S.cfg = cfg(id) ? id : null; S.view = "configuracoes"; S.pop = null; render(); document.getElementById("conteudo")?.focus(); return; }
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); if (sec(g.dataset.go)) { if (g.dataset.tv) S.taskView = g.dataset.tv; go(g.dataset.go, g.dataset.new === "1"); } return; }
    const el = e.target.closest("[data-act]");
    if (!el) return;
    switch (el.dataset.act) {
      case "simulate": S.loading = !S.loading; render(); if (S.loading) setTimeout(() => { S.loading = false; render(); }, 3000); break;
      case "outside": { const [keys, msg] = OUTSIDE[S.outside % OUTSIDE.length](); S.outside++; flash(keys, msg); break; }
      case "collapse": S.collapsed = !S.collapsed; render(); break;
      case "drawer": S.drawer = !S.drawer; render(); break;
      case "palette": S.palette = !S.palette; S.query = ""; S.sel = 0; render(); break;
      case "theme": setTheme(isDark() ? "light" : "dark"); S.pop = null; render(); break;
      case "toast": S.pop = null; toast(el.dataset.msg); break;
      case "readall": S.unread = 0; S.pop = null; toast("Avisos marcados como lidos."); break;
      case "send": if (S.view !== "conversa") go("conversa", true); S.loading = true; render(); setTimeout(() => { S.loading = false; render(); }, 2500); break;
      case "open": S.chatOpen = true; render(); break;
      case "close": S.chatOpen = false; render(); break;
      case "note": S.note = Number(el.dataset.id); S.noteOpen = true; render(); break;
      case "noteback": S.noteOpen = false; render(); break;
      case "nm": S.noteMode = el.dataset.v === "ver" ? "ver" : "escrever"; render(); break;
      case "tv": if (TASK_VIEWS.some((x) => x.id === el.dataset.v)) S.taskView = el.dataset.v; render(); break;
      case "mf": if (MEM_FILTERS.some((x) => x.id === el.dataset.v)) S.memFilter = el.dataset.v; render(); break;
      case "sw": S.sw[el.dataset.k] = !S.sw[el.dataset.k]; render(); toast(S.sw[el.dataset.k] ? "Ligado." : "Desligado."); break;
      case "review": S.review = true; toast(el.dataset.msg); break;
      case "approve": { S.pending = false; const id = 5; S.autos.unshift({ id, name: "Conferir a semana no domingo", kind: "Rotina da Zuri", icon: "spark", sched: "Domingos às 20h", next: "Próxima: domingo às 20h", on: true }); flash([`a${id}`], "Rotina aprovada."); toast("Rotina aprovada. A primeira execução já está marcada."); break; }
      case "decline": S.pending = false; toast("Sugestão recusada."); break;
      case "plan": {
        S.planDone = true;
        const add = [["Pedir três orçamentos de mudança", "Até 8 de nov."], ["Avisar o síndico da data", "Até 10 de nov."], ["Desligar a internet do apartamento", "19 de nov."], ["Fazer a vistoria de entrega", "20 de nov."]];
        const keys = add.map(([t, when]) => { const id = ++seq; S.tasks.push({ id, t, proj: "Mudança", when, due: "proxima", done: false }); return `t${id}`; });
        flash(keys, "Quatro tarefas criadas no projeto Mudança."); toast("Plano aprovado. 4 tarefas criadas.");
        break;
      }
      case "addtask": { const inp = document.getElementById("qa"); const t = (inp && inp.value.trim()) || "Tarefa de exemplo"; const id = ++seq; S.tasks.unshift({ id, t, proj: "", when: "Hoje", due: "hoje", done: false }); flash([`t${id}`, "count"]); toast("Tarefa adicionada."); break; }
      case "trash": { const t = byId(S.tasks, el.dataset.id); if (!t) break; S.tasks = S.tasks.filter((x) => x !== t); S.trashed = t; toast("Tarefa movida para a lixeira.", -t.id); break; }
      case "run": {
        const a = byId(S.autos, el.dataset.id); if (!a) break;
        a.running = true; render();
        setTimeout(() => { a.running = false; const id = ++seq; S.runs.unshift({ id, name: a.name, when: "Agora", how: "Rodou na hora", res: "Entregue", ok: true }); flash([`r${id}`, `a${a.id}`], `${a.name} rodou.`); toast("Pronto. O resultado está nas últimas execuções."); }, 1400);
        break;
      }
      case "pause": { const a = byId(S.autos, el.dataset.id); if (!a) break; a.on = !a.on; a.next = a.on ? "Próxima: em breve" : "Pausada agora"; flash([`a${a.id}`]); toast(a.on ? "Automação retomada." : "Automação pausada."); break; }
      case "task": {
        const t = byId(S.tasks, el.dataset.id); if (!t) break;
        t.done = !t.done;
        if (t.done) { t.prevWhen = t.when; t.when = "Concluída agora"; t.due0 = t.due; t.due = "feita"; toast("Tarefa concluída.", t.id); }
        else { t.when = t.prevWhen || t.when; t.due = t.due0 || "hoje"; render(); }
        break;
      }
      case "undo": {
        const id = Number(el.dataset.id);
        if (id < 0 && S.trashed) { S.tasks.unshift(S.trashed); S.trashed = null; }
        else { const t = byId(S.tasks, id); if (t) { t.done = false; t.when = t.prevWhen || t.when; t.due = t.due0 || "hoje"; } }
        S.toasts = []; render(); break;
      }
      case "pick": pick(Number(el.dataset.i)); break;
      case "pop": {
        const name = el.dataset.pop === "bell" ? "bell" : "conta";
        if (S.pop === name) { S.pop = null; render(); break; }
        const r = el.getBoundingClientRect(), w = innerWidth;
        S.popPos = r.left > w / 2 ? { top: r.bottom + 6, right: Math.max(12, w - r.right) } : r.top > innerHeight / 2 ? { top: Math.max(12, r.top - 300), left: Math.max(12, r.left) } : { top: r.bottom + 6, left: Math.max(12, r.left) };
        S.pop = name; render(); break;
      }
    }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "pq") { S.query = e.target.value; S.sel = 0; render(); } });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "k") { e.preventDefault(); S.palette = !S.palette; S.query = ""; S.sel = 0; render(); return; }
    if (e.key === "Escape" && (S.palette || S.pop || S.drawer)) { S.palette = false; S.pop = null; S.drawer = false; render(); return; }
    if (S.palette && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); const n = Math.max(1, paletteOptions().length); S.sel = (S.sel + (e.key === "ArrowDown" ? 1 : n - 1)) % n; render(); return; }
    if (S.palette && e.key === "Enter") { e.preventDefault(); pick(S.sel); }
  });
  addEventListener("resize", () => { if (S.view === "configuracoes") render(); });
  // Endereço: palavras separadas por hífen: uma tela, uma seção de Configurações, uma aba de Tarefas
  // ou um filtro de Memória, e -claro/-escuro, -limpo, -recolhido, -gaveta, -aberta, -busca, -carregando, -fora.
  function fromHash() {
    const h = location.hash.slice(1).split("-");
    if (h.includes("escuro")) setTheme("dark"); else if (h.includes("claro")) setTheme("light");
    document.body.classList.toggle("limpo", h.includes("limpo"));
    const v = h.find((x) => sec(x)); if (v) S.view = v;
    const c = h.find((x) => cfg(x)); if (c) { S.view = "configuracoes"; S.cfg = c; }
    const tv = h.find((x) => TASK_VIEWS.some((y) => y.id === x) && x !== "todas"); if (tv) S.taskView = tv;
    const mf = h.find((x) => ["incertas", "passadas"].includes(x)); if (mf) S.memFilter = mf;
    S.collapsed = h.includes("recolhido"); S.drawer = h.includes("gaveta"); S.chatOpen = h.includes("aberta"); S.noteOpen = h.includes("nota");
    S.loading = h.includes("carregando");
    if (h.includes("ver")) S.noteMode = "ver";
    if (h.includes("busca")) { S.palette = true; S.query = "lembrar de levar o carro na revisão "; }
    render();
    if (h.includes("fora")) { const [keys, msg] = OUTSIDE[0](); S.outside = 1; for (const k of keys) S.fresh.add(k); S.live = msg; render(); }
  }
  addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
