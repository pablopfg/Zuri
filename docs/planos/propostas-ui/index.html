<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- /moldura -->
<title>Zuri, cinco caras novas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Protótipo navegável das cinco propostas de interface da Zuri.
   Mesmos tokens de apps/web/src/styles.css (identidade Sinal), fonte do sistema
   para não pesar o pacote. Cada proposta muda a moldura, não a marca. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --raised: #eef0f4; --subtle: #fbfcfd;
  --fg: #0b0f19; --muted: #4b5563; --border: #dde1e8; --border-strong: #8b93a1;
  --accent: #15803d; --accent-hover: #166534; --accent-fg: #ffffff; --accent-soft: #dcfce7; --accent-text: #166534;
  --danger: #b42318; --danger-soft: #fdecea; --warning: #8a4b00; --warning-soft: #fdf1dc;
  --tile: #0b0f19; --mark: #f8fafc; --signal: #22c55e;
  --rail: #0b0f19; --rail-fg: #c9d1de; --rail-active: #1f2937;
  --scrim: rgba(11, 15, 25, 0.45); --shadow: 0 12px 32px rgba(11, 15, 25, 0.14);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0f19; --surface: #121826; --raised: #1a2233; --subtle: #0f1420;
  --fg: #e8ecf3; --muted: #a3acbd; --border: #263043; --border-strong: #56627a;
  --accent: #4ade80; --accent-hover: #86efac; --accent-fg: #052e16; --accent-soft: #0f2e1c; --accent-text: #6ee7a0;
  --danger: #ffb4ab; --danger-soft: #3b1715; --warning: #fcd34d; --warning-soft: #33270a;
  --tile: #1a2233; --mark: #f8fafc; --signal: #22c55e;
  --rail: #070a12; --rail-fg: #a3acbd; --rail-active: #1a2233;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b0f19; --surface: #121826; --raised: #1a2233; --subtle: #0f1420;
  --fg: #e8ecf3; --muted: #a3acbd; --border: #263043; --border-strong: #56627a;
  --accent: #4ade80; --accent-hover: #86efac; --accent-fg: #052e16; --accent-soft: #0f2e1c; --accent-text: #6ee7a0;
  --danger: #ffb4ab; --danger-soft: #3b1715; --warning: #fcd34d; --warning-soft: #33270a;
  --tile: #1a2233; --mark: #f8fafc; --signal: #22c55e;
  --rail: #070a12; --rail-fg: #a3acbd; --rail-active: #1a2233;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Barra do protótipo (não faz parte das propostas) */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: #1f2937; color: #f3f4f6; font-size: 13px; }
.proto b { font-weight: 600; margin-right: 4px; }
.proto .opts { display: flex; gap: 4px; flex-wrap: wrap; }
.proto button { min-height: 32px; padding: 0 10px; border-radius: 8px; color: #d1d5db; }
.proto button[aria-pressed="true"] { background: #f3f4f6; color: #111827; font-weight: 600; }
.proto .sep { flex: 1; }
.limpo .proto { display: none; }
#app { height: calc(100dvh - 44px); }
.limpo #app { height: 100dvh; }
@media (max-width: 767px) { #app { height: calc(100dvh - 82px); } }

/* Peças comuns */
.logo { width: 32px; height: 32px; flex: none; }
.logo .t { fill: var(--tile); } .logo .s { fill: var(--signal); } .logo .m { fill: var(--mark); }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
.iconbtn { position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: var(--fg); }
.iconbtn:hover { background: var(--raised); }
.badge { position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.count { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 11px; background: var(--raised); color: var(--muted); font-size: 12px; font-weight: 600; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.kbd { margin-left: auto; padding: 1px 6px; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 12px; }
.avatar { display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-weight: 700; font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border: 1px solid var(--border); background: var(--surface); }
.btn.ghost:hover { background: var(--raised); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 0 12px; border-radius: 10px; color: var(--muted); font-size: 14px; font-weight: 500; text-align: left; }
.row:hover { background: var(--raised); color: var(--fg); }
.row[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.row .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grouphead { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 36px; padding: 0 12px; margin-top: 14px; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
.grouphead:hover { color: var(--fg); }
.grouphead svg { transition: transform .15s; }
.grouphead[aria-expanded="false"] svg { transform: rotate(-90deg); }
.hint { padding: 4px 12px; color: var(--muted); font-size: 13px; }

/* Conteúdo */
main { flex: 1; min-width: 0; overflow-y: auto; }
.page { max-width: 960px; margin: 0 auto; padding: 28px 32px 120px; }
.pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.pagehead h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -0.02em; text-wrap: balance; }
.pagehead p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
.box { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 18px 10px; }
.box h2 { display: flex; align-items: center; justify-content: space-between; margin: 0 0 6px; font-size: 15px; }
.box h2 a { color: var(--accent-text); font-size: 13px; font-weight: 600; }
.box h2 a:hover { text-decoration: underline; }
.list { list-style: none; margin: 0; padding: 0; }
.list li + li { border-top: 1px solid var(--border); }
.task { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; }
.check { display: grid; place-items: center; width: 24px; height: 24px; margin-top: 1px; flex: none; border: 2px solid var(--border-strong); border-radius: 50%; color: transparent; }
.check:hover { border-color: var(--accent); color: var(--accent); }
.task.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.task.done .tt { color: var(--muted); text-decoration: line-through; }
.tt { font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; }
.late { color: var(--danger); font-weight: 600; }
.item { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 0; }
.item .ic { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--raised); color: var(--muted); }
.item a:hover { text-decoration: underline; }
.composer { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
.composer:focus-within { border-color: var(--accent); }
.composer input { flex: 1; min-width: 0; min-height: 44px; border: 0; outline: 0; background: transparent; }
.send { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); }
.mic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: var(--muted); }
.mic:hover { background: var(--raised); color: var(--fg); }
.composer-wrap { margin-bottom: 18px; }
.composer-wrap small { display: block; margin: 6px 4px 0; color: var(--muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { min-height: 40px; padding: 0 14px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--fg); font-size: 14px; }
.chip:hover { border-color: var(--accent); }
.empty { display: grid; justify-items: center; gap: 8px; padding: 48px 24px; text-align: center; border: 1px dashed var(--border-strong); border-radius: 16px; }
.empty .ic { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); }
.empty h2 { margin: 6px 0 0; font-size: 17px; }
.empty p { margin: 0; max-width: 46ch; color: var(--muted); }
.empty.err .ic { background: var(--danger-soft); color: var(--danger); }
.skel { display: grid; gap: 12px; }
.skel span { display: block; height: 56px; border-radius: 12px; background: linear-gradient(90deg, var(--raised), var(--subtle), var(--raised)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.msgs { display: grid; gap: 14px; padding-bottom: 16px; }
.bubble { max-width: 70ch; padding: 12px 16px; border-radius: 16px; }
.bubble.me { justify-self: end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 6px; }
.bubble.zuri { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
.who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }

/* Paleta de busca, avisos, menus e toasts */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.palette { position: fixed; z-index: 50; top: 12vh; left: 50%; width: min(640px, calc(100vw - 32px)); transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.palette .q { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); color: var(--muted); }
.palette .q input { flex: 1; min-height: 56px; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 16px; }
.palette .res { max-height: 50vh; overflow-y: auto; padding: 8px; }
.palette .gh { padding: 8px 10px 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
.palette .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 10px; border-radius: 10px; text-align: left; }
.palette .opt[aria-selected="true"], .palette .opt:hover { background: var(--raised); }
.palette .opt.ask { color: var(--accent-text); font-weight: 600; }
.palette .foot { display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.pop { position: fixed; z-index: 45; width: 300px; max-width: calc(100vw - 24px); padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
.pop h2 { margin: 4px 8px 6px; font-size: 14px; }
.pop .note { display: grid; gap: 2px; padding: 10px; border-radius: 10px; font-size: 14px; }
.pop .note:hover { background: var(--raised); }
.pop .note small { color: var(--muted); font-size: 12px; }
.pop .who-am-i { display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.pop .who-am-i small { display: block; color: var(--muted); font-size: 12px; }
.pop .ver { padding: 8px 12px 4px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 6px; }
.toasts { position: fixed; z-index: 55; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); }
.toast { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; background: var(--fg); color: var(--bg); border-radius: 14px; box-shadow: var(--shadow); font-size: 14px; animation: up .2s ease-out; }
.toast button { margin-left: auto; min-height: 36px; padding: 0 12px; border-radius: 8px; font-weight: 700; color: var(--signal); }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }

/* ---------- A: lateral clássica ---------- */
.sa, .sb, .sd, .se { display: flex; height: 100%; }
.sa .side { display: flex; flex-direction: column; width: 268px; flex: none; background: var(--subtle); border-right: 1px solid var(--border); transition: width .18s; }
.sa .side-head { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 8px 0 14px; }
.sa .side-scroll { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
.sa .newchat { margin-bottom: 6px; color: var(--fg); background: var(--surface); border: 1px solid var(--border); font-weight: 600; }
.sa .newchat:hover { border-color: var(--accent); background: var(--surface); }
.sa .acct { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 10px; border-radius: 12px; text-align: left; }
.sa .acct:hover { background: var(--raised); }
.sa .acct small, .sd .acct small { display: block; color: var(--muted); font-size: 12px; }
.sa .side-foot { padding: 8px 10px 10px; border-top: 1px solid var(--border); }
.sa[data-collapsed="true"] .side { width: 68px; }
.sa[data-collapsed="true"] .side-head { flex-direction: column; height: auto; gap: 2px; padding: 10px 0; }
.sa[data-collapsed="true"] .side-head .brand span, .sa[data-collapsed="true"] .row .txt, .sa[data-collapsed="true"] .acct .who-txt, .sa[data-collapsed="true"] .grouphead, .sa[data-collapsed="true"] .grp, .sa[data-collapsed="true"] .kbd { display: none; }
.sa[data-collapsed="true"] .row { justify-content: center; padding: 0; }
.sa .headbtns { display: flex; }
.sa[data-collapsed="true"] .headbtns { flex-direction: column; }
.sa[data-collapsed="true"] .side-scroll, .sa[data-collapsed="true"] .side-foot { padding-left: 10px; padding-right: 10px; }
.maincol { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 60px; padding: 0 12px; }
.topbar .ttl { font-weight: 600; }
.sa .topbar .mob { display: none; }
@media (max-width: 767px) {
  .sa .side { position: fixed; z-index: 46; top: 0; bottom: 0; left: 0; width: min(86vw, 320px); transform: translateX(-102%); transition: transform .2s; box-shadow: var(--shadow); }
  .sa[data-drawer="true"] .side { transform: none; }
  .sa[data-collapsed="true"] .side { width: min(86vw, 320px); }
  .sa .topbar { border-bottom: 1px solid var(--border); background: var(--surface); }
  .sa .topbar .mob { display: inline-grid; }
  .sa .topbar .desk { display: none; }
  .sa .collapse { display: none; }
}

/* ---------- B: trilho e painel ---------- */
.sb .rail { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; flex: none; padding: 10px 0; background: var(--rail); color: var(--rail-fg); }
.sb .rail .logo { margin: 4px 0 12px; }
.sb .rail .logo .t { fill: #1a2233; }
.sb .rbtn { display: grid; justify-items: center; gap: 3px; width: 64px; min-height: 56px; padding: 8px 0 6px; border-radius: 12px; color: var(--rail-fg); font-size: 11px; font-weight: 600; }
.sb .rbtn:hover { background: var(--rail-active); color: #fff; }
.sb .rbtn[aria-current="page"] { background: var(--rail-active); color: #fff; }
.sb .rbtn[aria-current="page"] svg { color: var(--signal); }
.sb .rail .grow { flex: 1; }
.sb .rail .avatar { background: #1f3a2a; color: #86efac; }
.sb .panel { display: flex; flex-direction: column; width: 272px; flex: none; background: var(--subtle); border-right: 1px solid var(--border); }
.sb .panel[hidden] { display: none; }
.sb .panel-head { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 8px 0 18px; font-weight: 700; font-size: 17px; }
.sb .panel-body { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
.sb .field { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--muted); }
.sb .field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); }
.sb .topbar { border-bottom: 1px solid var(--border); background: var(--surface); }
.sb .tabbar { display: none; }
@media (max-width: 767px) {
  .sb .rail, .sb .panel { display: none; }
  .sb .tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--border); }
  .sb .tab { display: grid; justify-items: center; gap: 2px; min-height: 56px; padding-top: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .sb .tab[aria-current="page"] { color: var(--accent-text); }
  .sb .mobpanel { display: block; }
}
.mobpanel { display: none; }

/* ---------- C: busca no centro ---------- */
.sc { display: flex; flex-direction: column; height: 100%; }
.sc .topbar { gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
.sc .bigsearch { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 560px; min-height: 44px; margin: 0 auto; padding: 0 14px; border: 1px solid var(--border); border-radius: 22px; background: var(--bg); color: var(--muted); font-size: 14px; }
.sc .bigsearch:hover { border-color: var(--accent); }
.sc .left, .sc .right { display: flex; align-items: center; gap: 4px; }
.sc:not([data-drawer="true"]) .drawer { visibility: hidden; }
.sc .drawer { position: fixed; z-index: 46; top: 0; bottom: 0; left: 0; display: flex; flex-direction: column; width: min(86vw, 300px); padding: 10px; background: var(--surface); box-shadow: var(--shadow); transform: translateX(-102%); transition: transform .2s; }
.sc[data-drawer="true"] .drawer { transform: none; visibility: visible; }
.sc .hero { display: grid; justify-items: center; gap: 8px; padding: 40px 0 28px; text-align: center; }
.sc .hero h1 { margin: 10px 0 0; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance; }
.sc .hero p { margin: 0; color: var(--muted); }
.sc .hero .composer { width: min(640px, 100%); margin-top: 14px; text-align: left; box-shadow: var(--shadow); }
.sc .hero .chips { justify-content: center; }
.sc .askbar { display: none; }
@media (max-width: 767px) {
  .sc .bigsearch { display: none; }
  .sc .askbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: block; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(transparent, var(--bg) 30%); }
  .sc .askbar button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 8px 0 18px; border: 1px solid var(--border); border-radius: 26px; background: var(--surface); color: var(--muted); box-shadow: var(--shadow); text-align: left; }
  .sc .askbar .send { margin-left: auto; width: 40px; height: 40px; border-radius: 20px; }
  .sc .hero { padding-top: 12px; }
  .sc .hero > .logo { display: none; }
  .sc .hero .composer { display: none; }
}

/* ---------- D: polegar primeiro ---------- */
.sd { flex-direction: column; }
.sd .topnav { display: flex; align-items: center; gap: 6px; min-height: 64px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.sd .tabs { display: flex; gap: 2px; margin-left: 18px; }
.sd .tabs a, .sd .tabs button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 22px; color: var(--muted); font-weight: 600; font-size: 14px; }

<body>
<section class="proto" aria-label="Controles do protótipo">
  <b>Protótipo</b>

  <div class="opts" id="opts-t"></div>
</section>
<div id="app"></div>
<div id="layer"></div>
<script>
(() => {
  const P = {
    a: "A · Lateral clássica", b: "B · Trilho e painel", c: "C · Busca no centro", d: "D · Polegar primeiro", e: "E · Compacta por grupos",
  };
  const ICON = {
    house: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .7-1.5l7-6a2 2 0 0 1 2.6 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    msg: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
    todo: '<rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
    note: '<path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.4 5.6a1 1 0 1 0-3-3l-5 5a2 2 0 0 0-.5.9l-.8 2.9a.5.5 0 0 0 .6.6l2.9-.8a2 2 0 0 0 .9-.5z"/>',
    brain: '<path d="M12 5a3 3 0 1 0-6 .1 4 4 0 0 0-2.5 5.8 4 4 0 0 0 .6 6.6A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 6 .1 4 4 0 0 1 2.5 5.8 4 4 0 0 1-.6 6.6A4 4 0 1 1 12 18Z"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    shield: '<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.8l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/>',
    out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
    panel: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
    pen: '<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a1 1 0 0 1 3 3l-9 9a2 2 0 0 1-.9.5l-2.9.8a.5.5 0 0 1-.6-.6l.8-2.9a2 2 0 0 1 .5-.9z"/>',
    bell: '<path d="M10.3 21a2 2 0 0 0 3.4 0"/><path d="M3.3 15.3A1 1 0 0 0 4 17h16a1 1 0 0 0 .7-1.7C19.4 14 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.4 6-2.7 7.3"/>',
    menu: '<path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/>',
    down: '<path d="m6 9 6 6 6-6"/>',
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    dots: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    up: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
    mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
    folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
    cal: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    retry: '<path d="M3 12a9 9 0 1 0 9-9 9.8 9.8 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/>',
    alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
    grid: '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  };
  const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICON[n]}</svg>`;
  const logo = () => '<svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect class="t" width="64" height="64" rx="16"/><g class="s"><circle cx="32" cy="19" r="12" opacity="0.25"/><circle cx="32" cy="19" r="7"/></g><rect class="m" x="27" y="31" width="10" height="21" rx="5"/></svg>';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // Dados de exemplo. Nada aqui é de uma pessoa real.
  const SECTIONS = [
    { id: "inicio", label: "Início", icon: "house" },
    { id: "conversa", label: "Conversa", icon: "msg" },
    { id: "tarefas", label: "Tarefas", icon: "todo" },
    { id: "notas", label: "Notas", icon: "note" },
    { id: "memoria", label: "Memória", icon: "brain" },
    { id: "automacoes", label: "Automações", icon: "clock" },
    { id: "acessos", label: "Acessos", icon: "shield" },
    { id: "configuracoes", label: "Configurações", icon: "gear" },
  ];
  const sec = (id) => SECTIONS.find((s) => s.id === id);
  const RECENTS = ["Organizar a mudança", "Presente de aniversário da Bia", "Orçamento de novembro", "Pão de fermentação natural", "Treino para a corrida de 10 km"];
  const PROJECTS = ["Mudança de apartamento", "Casa", "Trabalho"];
  const S = {
    p: "a", view: "inicio", theme: null, collapsed: false, drawer: false, palette: false, query: "", sel: 0,
    pop: null, quick: false, sheet: false, panel: true, notes: "erro",
    groups: { projetos: true, recentes: true, dia: true, zuri: true, conta: true, erecentes: false },
    tasks: [
      { id: 1, t: "Fechar o orçamento da transportadora", proj: "Mudança de apartamento", when: "Hoje, até 18h", done: false },
      { id: 2, t: "Pagar o condomínio", proj: "Casa", when: "Venceu ontem", late: true, done: false },
      { id: 3, t: "Ligar para a Bia", proj: "", when: "Hoje, 15h", done: false },
    ],
    toasts: [],
  };
  const pending = () => S.tasks.filter((t) => !t.done).length;

  /* ---------- Conteúdo das telas ---------- */
  function taskList() {
    return `<ul class="list">${S.tasks.map((t) => `
      <li class="task${t.done ? " done" : ""}">
        <button class="check" data-act="task" data-id="${t.id}" role="checkbox" aria-checked="${t.done}" aria-label="Concluir: ${esc(t.t)}">${ic("check", "sm")}</button>
        <div><div class="tt">${esc(t.t)}</div><div class="meta"><span class="${t.late && !t.done ? "late" : ""}">${t.when}</span>${t.proj ? `<span>${t.proj}</span>` : ""}</div></div>
      </li>`).join("")}</ul>`;
  }
  const upcoming = () => `<ul class="list">
      <li class="item"><span class="ic">${ic("clock", "sm")}</span><div><div class="tt">Resumo da manhã</div><div class="meta">Amanhã, 7h</div></div></li>
      <li class="item"><span class="ic">${ic("cal", "sm")}</span><div><div class="tt">Regar as plantas da varanda</div><div class="meta">Quinta, 8h</div></div></li>
    </ul>`;
  const recentList = (n = 4) => `<ul class="list">${RECENTS.slice(0, n).map((r, i) => `
      <li class="item"><span class="ic">${ic("msg", "sm")}</span><div><a href="#" data-go="conversa"><span class="tt">${r}</span></a><div class="meta">${["Hoje, 12h15", "Ontem", "Sábado", "31/10"][i]}</div></div></li>`).join("")}</ul>`;
  const composer = (ph = "Escreva para a Zuri") => `<div class="composer-wrap"><div class="composer">
      <label class="sr" for="cmp">Mensagem para a Zuri</label>
      <input id="cmp" placeholder="${ph}" autocomplete="off">
      <button class="mic" aria-label="Falar em vez de escrever">${ic("mic")}</button>
      <button class="send" aria-label="Enviar" data-act="send">${ic("up")}</button>
    </div><small>Enter envia. Shift + Enter pula linha.</small></div>`;
  const greet = `Boa noite, Ana`;
  const sub = () => {
    const n = pending();
    return n ? `Terça, 3 de novembro. ${n === 1 ? "Falta uma tarefa" : `Faltam ${["", "", "duas", "três"][n]} tarefas`} para hoje e o resumo da manhã sai às 7h.` : "Terça, 3 de novembro. Nada pendente para hoje. Bom descanso!";
  };

  function home(v) {
    if (v === "c") return `<div class="page">
      <div class="hero">${logo()}<h1>${greet}. Por onde começamos?</h1><p>${sub()}</p>
        <button class="composer" data-act="palette" style="cursor:text"><span style="flex:1;color:var(--muted);min-height:44px;display:flex;align-items:center">Peça algo ou procure uma tarefa, nota ou conversa</span><span class="kbd">Ctrl K</span></button>
        <div class="chips"><button class="chip" data-act="palette">Planejar a semana</button><button class="chip" data-act="palette">Resumir as notas de ontem</button><button class="chip" data-act="palette">Criar um lembrete</button></div>
      </div>
      <div class="grid2"><section class="box"><h2>Para hoje <a href="#" data-go="tarefas">Ver todas</a></h2>${taskList()}</section>
      <section class="box"><h2>Conversas recentes</h2>${recentList(3)}</section></div></div>`;
    if (v === "d") return `<div class="page">
      <div class="pagehead"><div><h1>${greet}</h1><p>${sub()}</p></div></div>
      <div class="widgets">
        <div class="widget hl"><strong>${pending()}</strong><span>tarefas para hoje</span></div>
        <div class="widget"><strong>1</strong><span>tarefa atrasada</span></div>
        <div class="widget"><strong>7h</strong><span>próximo resumo da Zuri</span></div>
      </div>
      <div class="grid2"><section class="box"><h2>Para hoje <a href="#" data-go="tarefas">Ver todas</a></h2>${taskList()}</section>
      <section class="box"><h2>Vem aí</h2>${upcoming()}</section></div></div>`;
    if (v === "e") return `<div class="page">
      <div class="pagehead"><div><h1>${greet}</h1><p>${sub()}</p></div></div>
      <div class="strip" tabindex="0" role="group" aria-label="Resumo do dia"><span class="stat"><b>${pending()}</b> para hoje</span><span class="stat warn"><b>1</b> atrasada</span><span class="stat"><b>2</b> automações hoje</span><span class="stat"><b>5</b> conversas na semana</span></div>
      ${composer()}
      <div class="grid2"><section class="box"><h2>Para hoje <a href="#" data-go="tarefas">Ver todas</a></h2>${taskList()}</section>
      <div style="display:grid;gap:12px;min-width:0"><section class="box"><h2>Vem aí</h2>${upcoming()}</section><section class="box"><h2>Conversas recentes</h2>${recentList(3)}</section></div></div></div>`;
    return `<div class="page">
      <div class="pagehead"><div><h1>${greet}</h1><p>${sub()}</p></div></div>
      ${composer()}
      <div class="grid2"><section class="box"><h2>Para hoje <a href="#" data-go="tarefas">Ver todas</a></h2>${taskList()}</section>
      <section class="box"><h2>Vem aí</h2>${upcoming()}</section></div></div>`;
  }
  function chat() {
    return `<div class="page" style="display:flex;flex-direction:column;min-height:100%">
      <div class="pagehead"><div><h1>Organizar a mudança</h1><p>Começou hoje, 12h15</p></div></div>
      <div class="msgs" style="flex:1">
        <div class="bubble me">Me ajuda a organizar a mudança? As chaves saem no dia 20.</div>
        <div class="who">${logo().replace('class="logo"', 'class="logo" style="width:24px;height:24px"')}Zuri</div>
        <div class="bubble zuri">Separei quatro tarefas no projeto Mudança de apartamento, com prazo até o dia 20. Dá uma olhada e me diz se posso criar. Nada fica salvo antes do seu ok.</div>
      </div>
      ${composer("Responda ou peça outra coisa")}</div>`;
  }
  function tasks() {
    return `<div class="page"><div class="pagehead"><div><h1>Tarefas</h1><p>${pending() ? `${pending()} para hoje` : "Tudo feito por hoje"}</p></div><button class="btn primary" data-act="toast" data-msg="Tarefa criada.">${ic("plus")}Nova tarefa</button></div>

  }

  /* ---------- Camadas: busca, avisos, conta, toasts ---------- */
  function paletteOptions() {
    const q = S.query.trim().toLowerCase();
    const go = SECTIONS.filter((s) => !q || s.label.toLowerCase().includes(q)).map((s) => ({ g: "Ir para", label: s.label, icon: s.icon, go: s.id }));
    const acts = [{ label: "Nova conversa", icon: "pen", go: "conversa" }, { label: "Nova tarefa", icon: "plus", msg: "Tarefa criada." }, { label: "Nova nota", icon: "note", msg: "Nota criada." }, { label: "Trocar o tema", icon: "moon", act: "theme" }]
      .filter((a) => !q || a.label.toLowerCase().includes(q)).map((a) => ({ g: "Fazer", ...a }));
    const found = [...S.tasks.map((t) => ({ label: t.t, icon: "todo", go: "tarefas" })), ...RECENTS.map((r) => ({ label: r, icon: "msg", go: "conversa" }))]
      .filter((x) => q && x.label.toLowerCase().includes(q)).map((x) => ({ g: "Encontrado", ...x }));
    const ask = q && (S.p === "c" || q.includes(" ")) ? [{ g: "Zuri", label: `Perguntar à Zuri: ${S.query.trim()}`, icon: "msg", go: "conversa", ask: true }] : [];
    return [...ask, ...found, ...acts, ...go];
  }
  function palette() {
    const opts = paletteOptions();
    S.sel = Math.min(S.sel, Math.max(0, opts.length - 1));
    let last = "", html = "";
    opts.forEach((o, i) => {
      if (o.g !== last) { html += `<div class="gh" role="presentation">${o.g}</div>`; last = o.g; }
      html += `<button class="opt${o.ask ? " ask" : ""}" role="option" id="opt-${i}" aria-selected="${i === S.sel}" data-act="pick" data-i="${i}">${ic(o.icon, "sm")}<span class="txt">${esc(o.label)}</span></button>`;
    });
    if (!opts.length) html = `<div class="empty" style="border:0;padding:28px 16px"><h2>Nada com "${esc(S.query.trim())}"</h2><p>Tente outra palavra. Se for uma pergunta, escreva a frase inteira que a Zuri responde.</p></div>`;
    return `<div class="scrim" data-act="palette"></div>
      <div class="palette" role="dialog" aria-modal="true" aria-label="Buscar">
        <div class="q">${ic("search")}<label class="sr" for="pq">Buscar ou perguntar</label><input id="pq" role="combobox" aria-expanded="true" aria-controls="pres" aria-activedescendant="opt-${S.sel}" placeholder="${S.p === "c" ? "Pergunte à Zuri ou procure qualquer coisa" : "Procure uma tela, tarefa ou conversa"}" value="${esc(S.query)}" autocomplete="off"><button class="iconbtn" data-act="palette" aria-label="Fechar a busca">${ic("x")}</button></div>

      </div>`;

  function popover() {

    const pos = S.popPos || { top: 70, left: 16 };
    const st = `top:${pos.top}px;${pos.right != null ? `right:${pos.right}px` : `left:${pos.left}px`}`;
    if (S.pop === "bell") return `<div class="scrim" style="background:transparent" data-act="pop" data-pop="bell"></div><section class="pop" role="dialog" aria-label="Avisos" style="${st}">

    if (S.pop === "mais") return `<div class="scrim" style="background:transparent" data-act="pop" data-pop="mais"></div><div class="mnav" role="menu" style="${st}">
      ${["memoria", "automacoes", "acessos"].map((id) => `<a href="#" role="menuitem" data-go="${id}">${ic(sec(id).icon, "sm")}${sec(id).label}</a>`).join("")}</div>`;
    return `<div class="scrim" style="background:transparent" data-act="pop" data-pop="conta"></div><div class="pop" role="menu" aria-label="Sua conta" style="${st}">
      <div class="who-am-i"><span class="avatar">A</span><div><b>Ana</b><small>dono@exemplo.com.br</small></div></div>
      <a href="#" class="row" role="menuitem" data-go="configuracoes">${ic("gear", "sm")}Configurações</a>

      <div class="ver">Versão 0.23.2</div></div>`;

  const toasts = () => `<div class="toasts" role="status" aria-live="polite">${S.toasts.map((t) => `<div class="toast"><span>${t.msg}</span>${t.undo ? `<button data-act="undo" data-id="${t.undo}">Desfazer</button>` : ""}</div>`).join("")}</div>`;

  /* ---------- Render e eventos ---------- */
  const app = document.getElementById("app"), layer = document.getElementById("layer");
  const isDark = () => S.theme ? S.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  function render() {
    const focusKey = document.activeElement && document.activeElement.id;
    app.innerHTML = { a: shellA, b: shellB, c: shellC, d: shellD, e: shellE }[S.p]();
    layer.innerHTML = (S.palette ? palette() : "") + popover() + toasts();
    document.getElementById("opts-p").innerHTML = Object.entries(P).map(([k, v]) => `<button data-proto="${k}" aria-pressed="${S.p === k}">${v}</button>`).join("");
    document.getElementById("opts-t").innerHTML = `<button data-theme-set="light" aria-pressed="${!isDark()}">Claro</button><button data-theme-set="dark" aria-pressed="${isDark()}">Escuro</button>`;
    if (S.palette) { const i = document.getElementById("pq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    else if (focusKey && document.getElementById(focusKey)) document.getElementById(focusKey).focus();
  }
  function toast(msg, undo) {
    const t = { msg, undo, k: Math.random() };
    S.toasts = [...S.toasts.slice(-2), t];
    render();
    setTimeout(() => { S.toasts = S.toasts.filter((x) => x !== t); render(); }, 5000);
  }
  function setTheme(th) { S.theme = th; document.documentElement.setAttribute("data-theme", th); }
  function go(view) { S.view = view; S.drawer = false; S.pop = null; S.sheet = false; S.quick = false; S.palette = false; if (view === "notas") S.notes = "erro"; render(); document.getElementById("conteudo")?.focus?.(); }

  document.addEventListener("click", (e) => {
    const pr = e.target.closest("[data-proto]");
    if (pr) { S.p = pr.dataset.proto; S.pop = null; S.drawer = false; history.replaceState(null, "", `#proposta-${S.p}`); render(); return; }
    const th = e.target.closest("[data-theme-set]");
    if (th) { setTheme(th.dataset.themeSet); render(); return; }
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const a = el.dataset.act;
    if (a === "collapse") { S.collapsed = !S.collapsed; render(); }
    else if (a === "drawer") { S.drawer = !S.drawer; render(); }
    else if (a === "panel") { S.panel = !S.panel; render(); }
    else if (a === "quick") { S.quick = !S.quick; render(); }
    else if (a === "sheet") { S.sheet = !S.sheet; render(); }
    else if (a === "palette") { S.palette = !S.palette; S.query = ""; S.sel = 0; render(); }
    else if (a === "group") { S.groups[el.dataset.g] = !S.groups[el.dataset.g]; render(); }
    else if (a === "theme") { setTheme(isDark() ? "light" : "dark"); S.pop = null; render(); }
    else if (a === "toast") { S.pop = null; S.sheet = false; toast(el.dataset.msg); }
    else if (a === "send") { toast("Mensagem enviada. A Zuri já está respondendo."); }
    else if (a === "retry") { S.notes = "carregando"; render(); setTimeout(() => { S.notes = "vazio"; render(); }, 1200); }
    else if (a === "task") {
      const t = S.tasks.find((x) => x.id === +el.dataset.id); t.done = !t.done;
      t.done ? toast("Tarefa concluída.", t.id) : render();
    } else if (a === "undo") { const t = S.tasks.find((x) => x.id === +el.dataset.id); t.done = false; S.toasts = []; render(); }
    else if (a === "pick") { pick(+el.dataset.i); }
    else if (a === "pop") {
      const name = el.dataset.pop;
      if (S.pop === name) { S.pop = null; render(); return; }
      const r = el.getBoundingClientRect(), w = innerWidth;
      S.popPos = r.left > w / 2 ? { top: r.bottom + 6, right: Math.max(12, w - r.right) } : (r.top > innerHeight / 2 ? { top: Math.max(12, r.top - 300), left: Math.max(12, r.left) } : { top: r.bottom + 6, left: Math.max(12, r.left) });
      S.pop = name; render();
    }
  });
  function pick(i) {
    const o = paletteOptions()[i]; if (!o) return;
    S.palette = false;
    if (o.ask) { S.view = "conversa"; render(); toast("A Zuri recebeu a pergunta."); return; }
    if (o.act === "theme") { setTheme(isDark() ? "light" : "dark"); render(); return; }
    if (o.msg) { render(); toast(o.msg); return; }
    go(o.go);
  }
  document.addEventListener("input", (e) => { if (e.target.id === "pq") { S.query = e.target.value; S.sel = 0; render(); } });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "k") { e.preventDefault(); S.palette = !S.palette; S.query = ""; S.sel = 0; render(); return; }
    if (e.key === "Escape") { if (S.palette || S.pop || S.drawer || S.quick || S.sheet) { S.palette = false; S.pop = null; S.drawer = false; S.quick = false; S.sheet = false; render(); } return; }
    if (S.palette && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); const n = paletteOptions().length; S.sel = (S.sel + (e.key === "ArrowDown" ? 1 : n - 1)) % Math.max(1, n); render(); return; }
    if (S.palette && e.key === "Enter") { e.preventDefault(); pick(S.sel); }
  });

  // Endereço: #proposta-a, com -escuro/-claro, -limpo (sem a barra do protótipo) e o nome de uma tela.
  function fromHash() {
    const h = location.hash.slice(1).split("-");
    const k = h[1]; if (P[k]) S.p = k;
    if (h.includes("escuro")) setTheme("dark"); else if (h.includes("claro")) setTheme("light");
    document.body.classList.toggle("limpo", h.includes("limpo"));
    const v = h.find((x) => sec(x)); if (v) S.view = v;
    if (h.includes("recolhido")) S.collapsed = true;
    if (h.includes("busca")) { S.palette = true; S.query = h.includes("pergunta") ? "lembrar de levar o carro na revisão " : ""; }
    if (h.includes("gaveta")) S.drawer = true;
    if (h.includes("rapida")) S.quick = true;
    render();
  }
  addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
</body>
</html>
