<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Zuri</title>
  <desc id="d">Símbolo da Zuri, um i cujo pingo é uma luz verde, ao lado do nome e da frase: sua assistente pessoal de IA, na sua conta Cloudflare.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#dde1e8"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f7f9" stop-opacity="1"/>
      <stop offset=".45" stop-color="#f6f7f9" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f6f7f9" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="#f6f7f9"/>
  <rect width="1280" height="400" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="28" fill="url(#fade)"/>
  <circle cx="300" cy="150" r="190" fill="url(#glow)"/>
  <g transform="translate(220 120) scale(2.5)">
    <rect width="64" height="64" rx="16" fill="#0b0f19"/>
    <circle cx="32" cy="19" r="12" fill="#22c55e" opacity=".25"/>
    <circle cx="32" cy="19" r="7" fill="#22c55e"/>
    <rect x="27" y="31" width="10" height="21" rx="5" fill="#f8fafc"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="440" y="200" font-size="104" font-weight="700" letter-spacing="-3" fill="#0b0f19">Zuri</text>
    <text x="444" y="252" font-size="28" fill="#4b5563">Sua assistente pessoal de IA, na sua conta Cloudflare.</text>
    <g font-size="18" font-weight="600">
      <rect x="444" y="282" width="176" height="36" rx="18" fill="#ffffff" stroke="#dde1e8"/>
      <circle cx="466" cy="300" r="5" fill="#22c55e"/>
      <text x="480" y="306" fill="#166534">um único dono</text>
      <rect x="632" y="282" width="168" height="36" rx="18" fill="#ffffff" stroke="#dde1e8"/>
      <text x="652" y="306" fill="#4b5563">web e Telegram</text>
      <rect x="812" y="282" width="136" height="36" rx="18" fill="#ffffff" stroke="#dde1e8"/>
      <text x="832" y="306" fill="#4b5563">plano Free</text>
    </g>
  </g>
